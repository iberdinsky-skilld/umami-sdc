# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Card

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: experimental

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper attributes.
    html_tag:
      type: string
      title: HTML tag for wrapper

      # Limit the available options by using enums.
      enum:
        - article
        - div
      meta:enum:
        article: Article
        div: Container
      x-translation-context: HTML tag
      # Provide a default value
      default: article

# Slots always hold arbitrary markup. We know that beforehand, so no need for
# a schema for slots.
slots:
  # The key is the name of the slot. In your template you will use
  # {% block content %}.
  content:
    title: Content
    required: true
    description: The card content.
    examples:
      - |
        <h2>Card Title</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec suscipit auctor dui, sed efficitur ipsum.</p>

thirdPartySettings:
  sdcStorybook:
    parameters:
      layout: 'centered'
    stories:
      preview:
        slots:
          content:
            - type: component
              component: 'umami:title'
              props:
                html_tag: h2
                label: 'Give your oatmeal the ultimate makeover'
                attributes:
                  class: 'umami-card__title'
            - type: component
              component: 'umami:read-more'
              props:
                attributes:
                  class: 'umami-card__read-more'
            - type: image
              uri: https://placehold.co/600x300
              attributes:
                class: 'umami-card__image'
      alt:
        slots:
          content:
            - type: image
              uri: https://placehold.co/400x200
              attributes:
                class: 'umami-card__image'
            - type: component
              component: 'umami:title'
              props:
                html_tag: h2
                label: 'Borscht with pork ribs'
                attributes:
                  class: 'umami-card__title'
            - type: component
              component: 'umami:read-more'
              props:
                attributes:
                  class: 'umami-card__read-more'
      withTags:
        slots:
          content:
            - type: component
              component: 'umami:title'
              props:
                html_tag: h2
                label: 'Borscht with pork ribs'
                attributes:
                  class: 'umami-card__title'
            - type: component
              component: 'umami:tags'
            - type: image
              uri: https://placehold.co/400x200
              attributes:
                class: 'umami-card__image'
            - type: component
              component: 'umami:read-more'
              props:
                attributes:
                  class: 'umami-card__read-more'