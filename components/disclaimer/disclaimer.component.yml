# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Disclaimer

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: experimental

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  # Props are always an object with keys. Each key is a variable in your
  # component template.
  type: object

  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper attributes.

slots:
  disclaimer:
    type: string
    description: Disclaimer text
    examples:
      - This is a disclaimer. It can be used to display legal information, terms and conditions, or any other important notices to users. The content of the disclaimer should be clear and concise, providing necessary information without overwhelming the user.
  copyright:
    type: string
    description: Copyright text of Disclaimer
    examples:
      - Terms & Conditions
