# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Tags

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    label:
      title: Label
      type: string
      examples:
        - 'Tags'
    extra_classes:
      type: array
      items:
        type: string
    title_attributes:
      type: Drupal\Core\Template\Attribute
      title: Title Attributes
    label_display:
      type: string
      title: Label Display
      enum:
        - above
        - inline
        - hidden
        - visually_hidden
      default: inline
    tags:
      title: Tags
      type: array
      items:
        type: object
        properties:
          content:
            title: Tag
            type: string
      examples:
        -
          - content: Tag 1
          - content: Tag 2
          - content: Tag 3

thirdPartySettings:
  sdcStorybook:
    stories:
      links:
        props:
          tags:
            - content: <a href="#">Tag 1</a>
            - content: <a href="#">Tag 2</a>
            - content: <a href="#">Tag 3</a>
      labelAbove:
        props:
          label_display: above
      labelHidden:
        props:
          label_display: visually_hidden
      linksGrid:
        props:
          extra_classes:
            - tags--grid
          label_display: visually_hidden
          tags:
            - content: <a href="#">Alcohol free</a>
            - content: <a href="#">Cake</a>
            - content: <a href="#">Dessert</a>
            - content: <a href="#">Gluten free</a>
            - content: <a href="#">Vegan</a>
            - content: <a href="#">Quick & easy</a>
            - content: <a href="#">Healthy</a>
            - content: <a href="#">Travel</a>
            - content: <a href="#">Quick & easy</a>