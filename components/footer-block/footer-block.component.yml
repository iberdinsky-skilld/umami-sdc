# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Footer Block

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: experimental

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  # Props are always an object with keys. Each key is a variable in your
  # component template.
  type: object

  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper attributes.

# Slots always hold arbitrary markup. We know that beforehand, so no need for
# a schema for slots.
slots:
  # The key is the name of the slot. In your template you will use
  # {% block content %}.
  content:
    title: Content
    examples:
      - |
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec suscipit auctor dui, sed efficitur ipsum.</p>
  image:
    title: Image
    examples:
      - |
        <img src="https://placehold.co/200x200" alt="Placeholder image">

thirdPartySettings:
  sdcStorybook:
    disabledStories:
      - Basic
    stories:
      preview:
        slots:
          content:
            - type: component
              component: 'umami:title'
              props:
                html_tag: h3
                label: 'Umami Food Magazine'
            - type: element
              tag: 'p'
              value: Skills and know-how. Magazine exclusive articles, recipes and plenty of reasons to get your copy today.
            - type: component
              component: 'umami:read-more'
              props:
                attributes:
                  class: 'footer-block__link'
          image: <img src="https://placehold.co/200x200" alt="Random image">
